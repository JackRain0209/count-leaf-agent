<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Agent - 油菜表型分析</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 28px; margin-bottom: 8px; color: #38bdf8; }
        .subtitle { color: #94a3b8; margin-bottom: 32px; }

        .upload-area {
            border: 2px dashed #334155; border-radius: 16px; padding: 48px;
            text-align: center; cursor: pointer; transition: all 0.2s;
            background: #1e293b; margin-bottom: 32px;
        }
        .upload-area:hover { border-color: #38bdf8; background: #1e3a5f; }
        .upload-area.dragover { border-color: #22d3ee; background: #164e63; }
        .upload-area input { display: none; }
        .upload-icon { font-size: 48px; margin-bottom: 12px; }
        .upload-text { color: #94a3b8; }

        .results {
            background: #1e293b; border-radius: 12px; padding: 24px;
            border: 1px solid #334155; margin-bottom: 32px;
        }
        .results h2 { font-size: 20px; margin-bottom: 16px; color: #38bdf8; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .result-item {
            background: #0f172a; border-radius: 8px; padding: 16px;
            border: 1px solid #1e293b;
        }
        .result-item .label { font-size: 12px; color: #64748b; margin-bottom: 4px; }
        .result-item .value { font-size: 24px; font-weight: 700; color: #f1f5f9; }
        .result-item .unit { font-size: 14px; color: #94a3b8; }

        .loading { text-align: center; padding: 48px; color: #94a3b8; }
        .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error { background: #7f1d1d; color: #fca5a5; padding: 16px; border-radius: 8px; margin: 16px 0; }
        .vlm-notes { margin-top: 16px; padding: 12px 16px; background: #0f172a; border-radius: 8px; font-size: 13px; color: #94a3b8; }
        .hidden { display: none; }

        /* Pipeline flow */
        .pipeline { margin-top: 32px; }
        .pipeline h2 { font-size: 20px; margin-bottom: 20px; color: #38bdf8; }
        .pipeline-step {
            display: flex; gap: 20px; margin-bottom: 16px; align-items: flex-start;
            background: #1e293b; border-radius: 12px; border: 1px solid #334155;
            overflow: hidden; transition: border-color 0.2s;
        }
        .pipeline-step:hover { border-color: #38bdf8; }
        .step-number {
            flex-shrink: 0; width: 48px; min-height: 100%;
            background: #0f172a; display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; color: #38bdf8;
        }
        .step-content { flex: 1; padding: 12px 16px 12px 0; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
        .step-img-wrap { flex-shrink: 0; max-width: 400px; min-width: 200px; }
        .step-img-wrap img { width: 100%; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
        .step-img-wrap img:hover { transform: scale(1.02); }
        .step-desc {
            flex: 1; min-width: 200px; font-size: 14px; color: #cbd5e1; line-height: 1.6;
            padding-top: 4px;
        }
        .step-desc .tag {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 11px; font-weight: 600; margin-right: 6px;
        }
        .tag-vlm { background: #1e3a5f; color: #38bdf8; }
        .tag-cv { background: #1a2e1a; color: #4ade80; }
        .tag-crop { background: #2d1f3d; color: #c084fc; }
        .tag-result { background: #3d2a1a; color: #fb923c; }

        /* Lightbox */
        .lightbox {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 1000; align-items: center; justify-content: center; cursor: zoom-out;
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 8px; }

        /* Primary button */
        .btn-primary {
            background: #38bdf8; color: #0f172a; border: 0;
            padding: 10px 20px; font-size: 14px; font-weight: 600;
            border-radius: 8px; cursor: pointer; transition: background 0.2s;
        }
        .btn-primary:hover:not(:disabled) { background: #0ea5e9; }
        .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        /* Modal */
        .modal {
            display: none; position: fixed; inset: 0; z-index: 500;
            align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.7); }
        .modal-panel {
            position: relative; background: #1e293b; border: 1px solid #334155;
            border-radius: 12px; width: min(1100px, 92vw); max-height: 88vh;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid #334155;
        }
        .modal-header h3 { color: #38bdf8; font-size: 18px; }
        .modal-close {
            background: transparent; border: 0; color: #94a3b8;
            font-size: 24px; cursor: pointer; width: 32px; height: 32px;
            border-radius: 6px;
        }
        .modal-close:hover { background: #334155; color: #fff; }
        .modal-toolbar {
            padding: 12px 20px; display: flex; gap: 12px; align-items: center;
            border-bottom: 1px solid #334155;
        }
        .modal-toolbar input {
            flex: 1; background: #0f172a; border: 1px solid #334155;
            color: #e2e8f0; padding: 8px 12px; border-radius: 6px; font-size: 13px;
        }
        .modal-toolbar input:focus { outline: none; border-color: #38bdf8; }
        .muted { color: #64748b; font-size: 13px; }
        .modal-body {
            flex: 1; display: flex; min-height: 0;
        }
        .db-list {
            width: 360px; flex-shrink: 0; overflow-y: auto;
            border-right: 1px solid #334155; padding: 8px;
        }
        .db-item {
            padding: 8px 10px; border-radius: 6px; cursor: pointer;
            transition: background 0.1s; margin-bottom: 2px;
        }
        .db-item:hover { background: #0f172a; }
        .db-item.selected { background: #1e3a5f; }
        .db-item .name {
            font-size: 13px; color: #e2e8f0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .db-item .folder {
            font-size: 11px; color: #64748b;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .db-preview {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 20px; background: #0f172a; overflow: auto;
        }
        .db-preview img {
            max-width: 100%; max-height: 100%; border-radius: 8px;
            object-fit: contain;
        }
        .db-preview .placeholder {
            color: #64748b; font-size: 14px; text-align: center;
        }
        .db-preview-loading { color: #64748b; font-size: 14px; }
        .modal-footer {
            padding: 14px 20px; border-top: 1px solid #334155;
            display: flex; align-items: center; justify-content: space-between;
        }

        /* Processing indicator (shown between steps while backend is working) */
        .processing-card {
            display: flex; align-items: center; gap: 16px; padding: 20px 24px;
            background: linear-gradient(90deg, #1e293b 0%, #1e3a5f 50%, #1e293b 100%);
            background-size: 200% 100%;
            border-radius: 12px; border: 1px solid #334155;
            margin-bottom: 16px;
            animation: shimmer 2s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .processing-orb {
            position: relative; width: 40px; height: 40px; flex-shrink: 0;
        }
        .processing-orb::before, .processing-orb::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            border: 3px solid transparent; border-top-color: #38bdf8;
            animation: orb-spin 1s linear infinite;
        }
        .processing-orb::after {
            inset: 6px; border-top-color: #22d3ee;
            animation: orb-spin 0.7s linear infinite reverse;
        }
        @keyframes orb-spin { to { transform: rotate(360deg); } }
        .processing-text {
            flex: 1; color: #cbd5e1; font-size: 14px; font-weight: 500;
        }
        .processing-text .dots::after {
            content: '...'; display: inline-block; width: 20px; text-align: left;
            animation: dots 1.4s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        .processing-badge {
            padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
            background: rgba(56,189,248,0.15); color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 CV Agent — 油菜表型分析</h1>
        <p class="subtitle">上传油菜植株照片，自动分析分支数、角果数、主干/主支长度</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📷</div>
            <div class="upload-text">点击或拖拽上传植株照片（JPG / PNG）</div>
            <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.bmp,.tiff">
        </div>

        <div style="margin-bottom: 24px; text-align: center;">
            <button id="openDbBtn" class="btn-primary">📂 在线数据库</button>
        </div>

        <div class="modal" id="dbModal">
            <div class="modal-backdrop" data-close></div>
            <div class="modal-panel">
                <div class="modal-header">
                    <h3>📂 在线数据库 — 选择一张图片进行分析</h3>
                    <button class="modal-close" data-close>×</button>
                </div>
                <div class="modal-toolbar">
                    <input type="text" id="dbSearch" placeholder="按文件名/文件夹过滤...">
                    <span id="dbCount" class="muted">加载中...</span>
                </div>
                <div class="modal-body">
                    <div class="db-list" id="dbList"></div>
                    <div class="db-preview" id="dbPreview">
                        <div class="placeholder">← 从左侧选择一张图片查看预览</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <span id="dbSelected" class="muted">未选择</span>
                    <button id="dbSubmitBtn" class="btn-primary" disabled>提交分析</button>
                </div>
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <div>正在分析中... 这可能需要 15-30 秒</div>
        </div>

        <div id="errorBox" class="error hidden"></div>

        <div id="resultSection" class="hidden">
            <div class="results">
                <h2>📊 分析结果</h2>
                <div class="result-grid" id="resultGrid"></div>
                <div class="vlm-notes" id="vlmNotes"></div>
            </div>

            <div class="pipeline">
                <h2>� 分析流水线（全部步骤）</h2>
                <div id="pipelineSteps"></div>
            </div>
        </div>

        <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
            <img id="lightboxImg" src="">
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('errorBox');
        const resultSection = document.getElementById('resultSection');

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('active');
        }

        function getTag(desc) {
            if (desc.includes('VLM') || desc.includes('豆包')) return '<span class="tag tag-vlm">VLM</span>';
            if (desc.includes('裁剪')) return '<span class="tag tag-crop">裁剪</span>';
            if (desc.includes('结果') || desc.includes('原始')) return '<span class="tag tag-result">输出</span>';
            return '<span class="tag tag-cv">CV</span>';
        }

        function removeProcessingCard() {
            const existing = document.getElementById('processingCard');
            if (existing) existing.remove();
        }

        function showProcessingCard(text = '正在执行下一步分析') {
            removeProcessingCard();
            const container = document.getElementById('pipelineSteps');
            const card = document.createElement('div');
            card.id = 'processingCard';
            card.className = 'processing-card';
            card.innerHTML = `
                <div class="processing-orb"></div>
                <div class="processing-text">${text}<span class="dots"></span></div>
                <span class="processing-badge">处理中</span>
            `;
            container.appendChild(card);
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function appendStep(step) {
            removeProcessingCard();
            const container = document.getElementById('pipelineSteps');
            const div = document.createElement('div');
            div.className = 'pipeline-step';
            div.style.opacity = '0';
            div.style.transform = 'translateY(12px)';
            div.style.transition = 'opacity 0.3s, transform 0.3s';
            div.innerHTML = `
                <div class="step-number">${step.step}</div>
                <div class="step-content">
                    <div class="step-img-wrap">
                        <img src="${step.url}" alt="Step ${step.step}" onclick="openLightbox('${step.url}')">
                    </div>
                    <div class="step-desc">
                        ${getTag(step.description)}
                        ${step.description}
                    </div>
                </div>
            `;
            container.appendChild(div);
            requestAnimationFrame(() => {
                div.style.opacity = '1';
                div.style.transform = 'translateY(0)';
            });
            // Show processing card for the next step
            showProcessingCard('正在执行下一步分析');
            div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showResult(data) {
            removeProcessingCard();
            const grid = document.getElementById('resultGrid');
            grid.innerHTML = `
                <div class="result-item">
                    <div class="label">部件数</div>
                    <div class="value">${data.plant_count ?? 0} <span class="unit">个</span></div>
                </div>
                <div class="result-item">
                    <div class="label">角果总数</div>
                    <div class="value">${data.total_pods ?? 0} <span class="unit">个</span></div>
                </div>
                <div class="result-item">
                    <div class="label">处理步骤</div>
                    <div class="value">${data.total_steps ?? 0} <span class="unit">步</span></div>
                </div>
                <div class="result-item">
                    <div class="label">耗时</div>
                    <div class="value">${data.processing_time_s} <span class="unit">秒</span></div>
                </div>
            `;
            const notes = [];
            if (data.plants?.length) {
                data.plants.forEach(p => {
                    let info = `<b>#${p.id} ${p.label}</b>`;
                    if (p.pod_count != null) info += `，角果 ${p.pod_count} 个`;
                    if (p.description) info += ` — ${p.description}`;
                    notes.push(info);
                });
            }
            document.getElementById('vlmNotes').innerHTML = notes.join('<br>') || '';
            document.querySelector('.results').style.opacity = '0';
            document.querySelector('.results').style.transition = 'opacity 0.4s';
            requestAnimationFrame(() => { document.querySelector('.results').style.opacity = '1'; });
        }

        async function consumeStream(res) {
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const jsonStr = line.slice(6).trim();
                    if (!jsonStr) continue;
                    try {
                        const event = JSON.parse(jsonStr);
                        if (event.type === 'step') appendStep(event);
                        else if (event.type === 'result') showResult(event);
                        else if (event.type === 'error') {
                            removeProcessingCard();
                            errorBox.textContent = `分析失败: ${event.message}`;
                            errorBox.classList.remove('hidden');
                        }
                    } catch (e) { /* skip malformed */ }
                }
            }
        }

        function resetAnalysisUI() {
            loading.classList.add('hidden');
            errorBox.classList.add('hidden');
            resultSection.classList.remove('hidden');
            document.getElementById('pipelineSteps').innerHTML = '';
            document.getElementById('resultGrid').innerHTML = '';
            document.getElementById('vlmNotes').innerHTML = '';
            showProcessingCard('正在启动分析流水线');
        }

        async function handleFile(file) {
            resetAnalysisUI();
            const form = new FormData();
            form.append('file', file);
            try {
                const res = await fetch('/api/analyze', { method: 'POST', body: form });
                if (!res.ok) throw new Error(await res.text());
                loading.classList.add('hidden');
                await consumeStream(res);
            } catch (e) {
                removeProcessingCard();
                errorBox.textContent = `分析失败: ${e.message}`;
                errorBox.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        async function analyzeOnline(relPath) {
            resetAnalysisUI();
            try {
                const res = await fetch('/api/analyze_online', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: relPath }),
                });
                if (!res.ok) throw new Error(await res.text());
                loading.classList.add('hidden');
                await consumeStream(res);
            } catch (e) {
                removeProcessingCard();
                errorBox.textContent = `分析失败: ${e.message}`;
                errorBox.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        // ── 在线数据库 Modal ──
        const dbModal = document.getElementById('dbModal');
        const dbList = document.getElementById('dbList');
        const dbPreview = document.getElementById('dbPreview');
        const dbCount = document.getElementById('dbCount');
        const dbSearch = document.getElementById('dbSearch');
        const dbSelected = document.getElementById('dbSelected');
        const dbSubmitBtn = document.getElementById('dbSubmitBtn');
        let dbItems = [];
        let dbSelectedPath = null;

        document.getElementById('openDbBtn').addEventListener('click', openDbModal);
        dbModal.querySelectorAll('[data-close]').forEach(el =>
            el.addEventListener('click', () => dbModal.classList.remove('active'))
        );
        dbSearch.addEventListener('input', () => renderDbList(dbSearch.value.trim().toLowerCase()));
        dbSubmitBtn.addEventListener('click', () => {
            if (!dbSelectedPath) return;
            dbModal.classList.remove('active');
            analyzeOnline(dbSelectedPath);
        });

        async function openDbModal() {
            dbModal.classList.add('active');
            dbList.innerHTML = '<div class="muted" style="text-align:center;padding:40px">加载中...</div>';
            dbCount.textContent = '加载中...';
            dbSelectedPath = null;
            dbSelected.textContent = '未选择';
            dbSubmitBtn.disabled = true;
            dbPreview.innerHTML = '<div class="placeholder">← 从左侧选择一张图片查看预览</div>';
            try {
                const res = await fetch('/api/online_images');
                const data = await res.json();
                dbItems = data.items || [];
                dbCount.textContent = `共 ${dbItems.length} 张图片`;
                renderDbList('');
            } catch (e) {
                dbList.innerHTML = `<div class="error">加载失败: ${e.message}</div>`;
            }
        }

        function renderDbList(filter) {
            const filtered = filter
                ? dbItems.filter(it =>
                    it.name.toLowerCase().includes(filter) ||
                    it.folder.toLowerCase().includes(filter))
                : dbItems;
            if (!filtered.length) {
                dbList.innerHTML = '<div class="muted" style="text-align:center;padding:40px">无匹配图片</div>';
                return;
            }
            dbList.innerHTML = filtered.map((it, i) => `
                <div class="db-item${it.path === dbSelectedPath ? ' selected' : ''}"
                     data-path="${encodeURIComponent(it.path)}"
                     data-url="${encodeURIComponent(it.url)}"
                     title="${it.folder}/${it.name}">
                    <div class="name">${it.name}</div>
                    <div class="folder">${it.folder}</div>
                </div>
            `).join('');
            dbList.querySelectorAll('.db-item').forEach(el => {
                el.addEventListener('click', () => {
                    const path = decodeURIComponent(el.dataset.path);
                    const url = decodeURIComponent(el.dataset.url);
                    dbSelectedPath = path;
                    dbSubmitBtn.disabled = false;
                    dbSelected.textContent = `已选择：${path}`;
                    dbList.querySelectorAll('.db-item').forEach(e => e.classList.remove('selected'));
                    el.classList.add('selected');
                    // Load preview
                    dbPreview.innerHTML = '<div class="db-preview-loading">加载预览中...</div>';
                    const img = new Image();
                    img.onload = () => {
                        dbPreview.innerHTML = '';
                        dbPreview.appendChild(img);
                    };
                    img.onerror = () => {
                        dbPreview.innerHTML = '<div class="placeholder">预览加载失败</div>';
                    };
                    img.src = url;
                });
            });
        }
    </script>
</body>
</html>
