<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Agent - 油菜表型分析</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 28px; margin-bottom: 8px; color: #38bdf8; }
        .subtitle { color: #94a3b8; margin-bottom: 32px; }

        .upload-area {
            border: 2px dashed #334155; border-radius: 16px; padding: 48px;
            text-align: center; cursor: pointer; transition: all 0.2s;
            background: #1e293b; margin-bottom: 32px;
        }
        .upload-area:hover { border-color: #38bdf8; background: #1e3a5f; }
        .upload-area.dragover { border-color: #22d3ee; background: #164e63; }
        .upload-area input { display: none; }
        .upload-icon { font-size: 48px; margin-bottom: 12px; }
        .upload-text { color: #94a3b8; }

        .results { margin-bottom: 32px; }
        .results h2 { font-size: 20px; margin-bottom: 14px; color: #e2e8f0; }
        .sample-id-badge {
            display: inline-block; vertical-align: middle;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff; font-size: 14px; font-weight: 600;
            padding: 3px 12px; border-radius: 6px;
            margin-left: 10px;
        }
        .sample-id-badge:empty { display: none; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .result-item {
            background: linear-gradient(180deg, #172033 0%, #101827 100%);
            border-radius: 8px; padding: 15px 16px;
            border: 1px solid #2f415d; min-height: 94px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .result-item.primary { border-color: #38bdf8; box-shadow: 0 0 0 1px rgba(56,189,248,0.15) inset; }
        .result-item .label { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
        .result-item .value {
            font-size: 26px; line-height: 1.1; font-weight: 750; color: #f8fafc;
            word-break: break-word;
        }
        .result-item .value.compact { font-size: 17px; line-height: 1.35; font-weight: 650; }
        .result-item .value.blank { color: #64748b; }
        .result-item .unit { font-size: 14px; color: #94a3b8; }
        .result-meta {
            grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px;
            color: #94a3b8; font-size: 12px;
        }
        .result-meta span {
            border: 1px solid #334155; border-radius: 999px;
            padding: 4px 8px; background: #0f172a;
        }

        .loading { text-align: center; padding: 48px; color: #94a3b8; }
        .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error { background: #7f1d1d; color: #fca5a5; padding: 16px; border-radius: 8px; margin: 16px 0; }
        .vlm-notes { margin-top: 16px; padding: 12px 16px; background: #0f172a; border-radius: 8px; font-size: 13px; color: #94a3b8; }
        .hidden { display: none; }

        /* Pipeline flow */
        .pipeline { margin-top: 32px; }
        .pipeline h2 { font-size: 20px; margin-bottom: 20px; color: #38bdf8; }
        .pipeline-step {
            display: flex; gap: 20px; margin-bottom: 16px; align-items: flex-start;
            background: #1e293b; border-radius: 12px; border: 1px solid #334155;
            overflow: hidden; transition: border-color 0.2s;
        }
        .pipeline-step:hover { border-color: #38bdf8; }
        .step-number {
            flex-shrink: 0; width: 48px; min-height: 100%;
            background: #0f172a; display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; color: #38bdf8;
        }
        .step-content { flex: 1; padding: 12px 16px 12px 0; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
        .step-media { display: flex; align-items: flex-start; gap: 10px; flex-shrink: 0; }
        .step-img-wrap { flex-shrink: 0; max-width: 400px; min-width: 200px; }
        .pipeline-step-editable .step-media { width: min(960px, 100%); max-width: 100%; }
        .pipeline-step-editable .step-img-wrap.editable-image-wrap {
            flex: 1 1 auto; min-width: min(280px, 100%); max-width: none; width: auto;
        }
        .step-img-wrap img { width: 100%; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
        .step-img-wrap img:hover { transform: scale(1.02); }
        .editable-image-wrap {
            position: relative; overflow: hidden; border-radius: 8px;
            background: #020617;
        }
        .editable-image-wrap img { display: block; }
        .editable-image-wrap img:hover { transform: none; }
        .editable-image-wrap.adding img,
        .editable-image-wrap.adding .annotation-layer { cursor: crosshair; }
        .editable-image-wrap.deleting img,
        .editable-image-wrap.deleting .annotation-layer { cursor: cell; }
        .annotation-layer {
            position: absolute; inset: 0; z-index: 2; pointer-events: none;
        }
        .editable-image-wrap.editing .annotation-layer { pointer-events: auto; }
        .annotation-marker {
            position: absolute; width: 10px; height: 10px; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.9), 0 1px 6px rgba(0,0,0,0.35);
        }
        .editable-image-wrap.editing .annotation-marker { pointer-events: auto; }
        .annotation-marker.green { background: #22c55e; border: 1px solid #bbf7d0; }
        .annotation-marker.red { background: #ef4444; border: 1px solid #fecaca; }
        .annotation-marker.purple { background: #a855f7; border: 1px solid #e9d5ff; }
        .annotation-tools {
            flex-shrink: 0; display: flex; flex-direction: column; align-items: stretch;
            gap: 8px; min-width: 48px;
        }
        .annotation-edit-btn,
        .annotation-tool-btn {
            min-width: 44px; height: 36px; border: 1px solid #334155;
            border-radius: 8px; background: #0f172a; color: #cbd5e1;
            font-size: 14px; font-weight: 700; cursor: pointer;
        }
        .annotation-edit-btn:hover,
        .annotation-tool-btn:hover { border-color: #38bdf8; color: #f8fafc; }
        .annotation-edit-btn.active,
        .annotation-tool-btn.active {
            background: #1e3a5f; border-color: #38bdf8; color: #e0f2fe;
        }
        .annotation-tool-panel { display: flex; flex-direction: column; gap: 8px; position: relative; }
        .annotation-tool-panel.hidden,
        .annotation-color-menu.hidden { display: none; }
        .annotation-color-menu {
            position: absolute; left: 48px; top: 0; z-index: 20;
            min-width: 92px; padding: 6px; border-radius: 8px;
            background: #0f172a; border: 1px solid #334155;
            box-shadow: 0 12px 28px rgba(0,0,0,0.35);
        }
        .annotation-color-menu button {
            width: 100%; display: flex; align-items: center; gap: 8px;
            background: transparent; border: 0; color: #cbd5e1;
            padding: 7px 8px; border-radius: 6px; cursor: pointer;
            font-size: 13px; white-space: nowrap;
        }
        .annotation-color-menu button:hover { background: #1e293b; color: #fff; }
        .point-swatch {
            width: 12px; height: 12px; border-radius: 50%; display: inline-block;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.7);
        }
        .point-swatch.green { background: #22c55e; }
        .point-swatch.red { background: #ef4444; }
        .point-swatch.purple { background: #a855f7; }
        .step-desc {
            flex: 1; min-width: 200px; font-size: 14px; color: #cbd5e1; line-height: 1.6;
            padding-top: 4px;
        }
        .step-desc .tag {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 11px; font-weight: 600; margin-right: 6px;
        }
        .tag-vlm { background: #1e3a5f; color: #38bdf8; }
        .tag-cv { background: #1a2e1a; color: #4ade80; }
        .tag-crop { background: #2d1f3d; color: #c084fc; }
        .tag-result { background: #3d2a1a; color: #fb923c; }

        /* Lightbox */
        .lightbox {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 1000; align-items: center; justify-content: center; cursor: zoom-out;
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 8px; }

        /* Primary button */
        .btn-primary {
            background: #38bdf8; color: #0f172a; border: 0;
            padding: 10px 20px; font-size: 14px; font-weight: 600;
            border-radius: 8px; cursor: pointer; transition: background 0.2s;
        }
        .btn-primary:hover:not(:disabled) { background: #0ea5e9; }
        .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        /* Modal */
        .modal {
            display: none; position: fixed; inset: 0; z-index: 500;
            align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.7); }
        .modal-panel {
            position: relative; background: #1e293b; border: 1px solid #334155;
            border-radius: 12px; width: min(1280px, 96vw); max-height: 88vh;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid #334155;
        }
        .modal-header h3 { color: #38bdf8; font-size: 18px; }
        .modal-close {
            background: transparent; border: 0; color: #94a3b8;
            font-size: 24px; cursor: pointer; width: 32px; height: 32px;
            border-radius: 6px;
        }
        .modal-close:hover { background: #334155; color: #fff; }
        .modal-toolbar {
            padding: 12px 20px; display: flex; gap: 12px; align-items: center;
            border-bottom: 1px solid #334155;
        }
        .modal-toolbar input {
            flex: 1; background: #0f172a; border: 1px solid #334155;
            color: #e2e8f0; padding: 8px 12px; border-radius: 6px; font-size: 13px;
        }
        .modal-toolbar input:focus { outline: none; border-color: #38bdf8; }
        .muted { color: #64748b; font-size: 13px; }
        .db-tabs {
            display: flex; flex-wrap: wrap; gap: 12px; padding: 14px 20px;
            border-bottom: 1px solid #334155; background: #172033;
        }
        .db-tab {
            background: #0f172a; color: #94a3b8; border: 1px solid #334155;
            min-height: 44px; min-width: 220px; flex: 1 1 220px;
            padding: 10px 18px; border-radius: 8px; font-size: 14px;
            font-weight: 650; cursor: pointer; white-space: nowrap;
            display: flex; align-items: center; justify-content: center;
        }
        .db-tab:hover { color: #e2e8f0; border-color: #475569; }
        .db-tab.active {
            background: #1e3a5f; color: #e2e8f0; border-color: #38bdf8;
            box-shadow: inset 0 0 0 1px #38bdf8;
        }
        .modal-body {
            flex: 1; display: flex; min-height: 0;
        }
        .db-list {
            width: 420px; flex-shrink: 0; overflow-y: auto;
            border-right: 1px solid #334155; padding: 8px;
        }
        .db-item {
            padding: 8px 10px; border-radius: 6px; cursor: pointer;
            transition: background 0.1s; margin-bottom: 2px;
        }
        .db-item:hover { background: #0f172a; }
        .db-item.selected { background: #1e3a5f; }
        .db-item .name {
            font-size: 13px; color: #e2e8f0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .db-item .folder {
            font-size: 11px; color: #64748b;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .db-preview {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 20px; background: #0f172a; overflow: auto;
        }
        .db-preview img {
            max-width: 100%; max-height: 100%; border-radius: 8px;
            object-fit: contain;
        }
        .db-preview .placeholder {
            color: #64748b; font-size: 14px; text-align: center;
        }
        .db-preview-loading { color: #64748b; font-size: 14px; }
        .modal-footer {
            padding: 14px 20px; border-top: 1px solid #334155;
            display: flex; align-items: center; justify-content: space-between;
        }

        /* Processing indicator (shown between steps while backend is working) */
        .processing-card {
            display: flex; align-items: center; gap: 16px; padding: 20px 24px;
            background: linear-gradient(90deg, #1e293b 0%, #1e3a5f 50%, #1e293b 100%);
            background-size: 200% 100%;
            border-radius: 12px; border: 1px solid #334155;
            margin-bottom: 16px;
            animation: shimmer 2s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .processing-orb {
            position: relative; width: 40px; height: 40px; flex-shrink: 0;
        }
        .processing-orb::before, .processing-orb::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            border: 3px solid transparent; border-top-color: #38bdf8;
            animation: orb-spin 1s linear infinite;
        }
        .processing-orb::after {
            inset: 6px; border-top-color: #22d3ee;
            animation: orb-spin 0.7s linear infinite reverse;
        }
        @keyframes orb-spin { to { transform: rotate(360deg); } }
        .processing-text {
            flex: 1; color: #cbd5e1; font-size: 14px; font-weight: 500;
        }
        .processing-text .dots::after {
            content: '...'; display: inline-block; width: 20px; text-align: left;
            animation: dots 1.4s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        .processing-badge {
            padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
            background: rgba(56,189,248,0.15); color: #38bdf8;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 CV Agent — 油菜表型分析</h1>
        <p class="subtitle">上传油菜植株照片，自动分析分支数、角果数、主干/主支长度</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📷</div>
            <div class="upload-text">点击或拖拽上传植株照片（JPG / PNG）</div>
            <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.bmp,.tiff">
        </div>

        <div style="margin-bottom: 24px; text-align: center;">
            <button id="openDbStalkBtn" class="btn-primary" style="background: #fb923c;">🌾 在线图片果柄分析</button>
        </div>

        <div class="modal" id="dbModal">
            <div class="modal-backdrop" data-close></div>
            <div class="modal-panel">
                <div class="modal-header">
                    <h3 id="dbModalTitle">📂 在线数据库 — 选择一张图片进行分析</h3>
                    <button class="modal-close" data-close>×</button>
                </div>
                <div class="modal-toolbar">
                    <input type="text" id="dbSearch" placeholder="按文件名/文件夹过滤...">
                    <span id="dbCount" class="muted">加载中...</span>
                </div>
                <div class="db-tabs" id="dbTabs"></div>
                <div class="modal-body">
                    <div class="db-list" id="dbList"></div>
                    <div class="db-preview" id="dbPreview">
                        <div class="placeholder">← 从左侧选择一张图片查看预览</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <span id="dbSelected" class="muted">未选择</span>
                    <button id="dbSubmitBtn" class="btn-primary" disabled>提交分析</button>
                </div>
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <div>正在分析中... 这可能需要 15-30 秒</div>
        </div>

        <div id="errorBox" class="error hidden"></div>

        <div id="resultSection" class="hidden">
            <div class="results">
                <h2>📊 分析结果 <span class="sample-id-badge" id="sampleIdBadge"></span></h2>
                <div class="result-grid" id="resultGrid"></div>
                <div class="vlm-notes" id="vlmNotes"></div>
            </div>

            <div class="pipeline">
                <h2>� 分析流水线（全部步骤）</h2>
                <div id="pipelineSteps"></div>
            </div>
        </div>

        <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
            <img id="lightboxImg" src="">
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('errorBox');
        const resultSection = document.getElementById('resultSection');
        let activeAnalysisToken = 0;
        let activeAnalysisController = null;

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('active');
        }

        function beginAnalysisRun() {
            if (activeAnalysisController) {
                activeAnalysisController.abort();
            }
            activeAnalysisToken += 1;
            activeAnalysisController = new AbortController();
            resetAnalysisUI();
            return {
                token: activeAnalysisToken,
                controller: activeAnalysisController,
            };
        }

        function isActiveAnalysis(token) {
            return token === activeAnalysisToken;
        }

        function noCacheUrl(url, key) {
            const sep = url.includes('?') ? '&' : '?';
            return `${url}${sep}v=${encodeURIComponent(key)}`;
        }

        function getTag(desc) {
            if (desc.includes('VLM') || desc.includes('豆包')) return '<span class="tag tag-vlm">VLM</span>';
            if (desc.includes('裁剪')) return '<span class="tag tag-crop">裁剪</span>';
            if (desc.includes('结果') || desc.includes('原始')) return '<span class="tag tag-result">输出</span>';
            return '<span class="tag tag-cv">CV</span>';
        }

        function isEditableFinalImage(desc) {
            return desc.includes('VLM 角果复核');
        }

        function isBlankMetric(value) {
            return value === null || value === undefined || value === '';
        }

        function buildResultSummary(data) {
            const plants = Array.isArray(data.plants) ? data.plants : [];
            const branches = plants.filter(p => p.label === '分枝');
            const mainBranches = plants.filter(p => p.label === '主枝');
            const summary = data.summary || {};
            const branchBreakdown = Array.isArray(summary.branch_pod_breakdown)
                ? summary.branch_pod_breakdown
                : branches.map(p => ({
                    id: p.id,
                    label: p.label,
                    pod_count: Number(p.pod_count || 0),
                }));
            const branchPodCount = summary.branch_total_pod_count
                ?? summary.branch_pod_count
                ?? data.branch_total_pod_count
                ?? data.branch_pod_count
                ?? branches.reduce((sum, p) => sum + Number(p.pod_count || 0), 0);
            return {
                branchCount: summary.branch_count
                    ?? data.branch_count
                    ?? branchBreakdown.length,
                mainPods: summary.main_inflorescence_pod_count
                    ?? data.main_inflorescence_pod_count
                    ?? mainBranches.reduce((sum, p) => sum + Number(p.pod_count || 0), 0),
                mainStemPlusMainPods: summary.main_stem_plus_main_pod_count
                    ?? data.main_stem_plus_main_pod_count
                    ?? '',
                branchPods: summary.branch_pod_count
                    ?? data.branch_pod_count
                    ?? branchPodCount,
                branchTotalPods: branchPodCount,
                totalPods: summary.total_pod_count ?? data.total_pods ?? 0,
                mainStemLength: summary.main_stem_length ?? data.main_stem_length ?? '',
                mainStemLengthCm: summary.main_stem_length_cm ?? data.main_stem_length_cm ?? '',
                sampleId: summary.sample_id ?? data.sample_id ?? '',
                rulerFound: summary.ruler_found ?? data.ruler_found ?? false,
                labelFound: summary.label_found ?? data.label_found ?? false,
                branchBreakdown,
            };
        }

        function formatBranchBreakdown(items, fallback) {
            if (!items.length) return String(fallback ?? 0);
            const shown = items.slice(0, 4).map(item => `#${item.id ?? '-'}:${item.pod_count ?? 0}`);
            if (items.length > shown.length) shown.push(`+${items.length - shown.length}`);
            return shown.join(' / ');
        }

        function resultMetric(label, value, unit = '', options = {}) {
            const blank = isBlankMetric(value);
            const classes = [
                'result-item',
                options.primary ? 'primary' : '',
            ].filter(Boolean).join(' ');
            const valueClass = [
                'value',
                options.compact ? 'compact' : '',
                blank ? 'blank' : '',
            ].filter(Boolean).join(' ');
            return `
                <div class="${classes}">
                    <div class="label">${label}</div>
                    <div class="${valueClass}">${blank ? '--' : value}${!blank && unit ? ` <span class="unit">${unit}</span>` : ''}</div>
                </div>
            `;
        }

        function clamp01(value) {
            return Math.max(0, Math.min(1, value));
        }

        function getPointerRatio(wrap, event) {
            const rect = wrap.getBoundingClientRect();
            return {
                x: clamp01((event.clientX - rect.left) / rect.width),
                y: clamp01((event.clientY - rect.top) / rect.height),
            };
        }

        function renderAnnotationMarker(state, marker) {
            const el = document.createElement('div');
            el.className = `annotation-marker ${marker.color}`;
            el.style.left = `${marker.x * 100}%`;
            el.style.top = `${marker.y * 100}%`;
            el.setAttribute('aria-hidden', 'true');
            el.title = marker.label || (marker.color === 'green' ? '绿点' : marker.color === 'purple' ? '紫点' : '红点');
            el.addEventListener('click', event => {
                if (state.editing) event.stopPropagation();
            });
            el.addEventListener('contextmenu', event => {
                if (!state.editing || state.mode !== 'delete') return;
                event.preventDefault();
                event.stopPropagation();
                removeAnnotationMarker(state, marker);
            });
            marker.el = el;
            state.layer.appendChild(el);
        }

        function addAnnotationMarker(state, color, x, y, source = 'added', meta = {}) {
            const marker = {
                id: ++state.nextMarkerId,
                color,
                x: clamp01(x),
                y: clamp01(y),
                source,
                label: meta.label || '',
                data: meta.data || null,
                el: null,
            };
            state.markers.push(marker);
            renderAnnotationMarker(state, marker);
            return marker;
        }

        function removeAnnotationMarker(state, marker) {
            if (marker.el) marker.el.remove();
            state.markers = state.markers.filter(item => item !== marker);
        }

        function findNearestMarker(state, x, y) {
            const rect = state.wrap.getBoundingClientRect();
            let nearest = null;
            let nearestDist = Infinity;
            state.markers.forEach(marker => {
                const dx = (marker.x - x) * rect.width;
                const dy = (marker.y - y) * rect.height;
                const dist = Math.hypot(dx, dy);
                if (dist < nearestDist) {
                    nearestDist = dist;
                    nearest = marker;
                }
            });
            return nearestDist <= 22 ? nearest : null;
        }

        function setAnnotationMode(state, mode) {
            state.mode = mode;
            state.wrap.classList.toggle('adding', mode === 'add');
            state.wrap.classList.toggle('deleting', mode === 'delete');
            state.addBtn.classList.toggle('active', mode === 'add');
            state.deleteBtn.classList.toggle('active', mode === 'delete');
        }

        function initEditableFinalImage(stepEl, imgUrl, initialPoints = []) {
            const wrap = stepEl.querySelector('.editable-image-wrap');
            const img = wrap.querySelector('img');
            const panel = stepEl.querySelector('.annotation-tool-panel');
            const editBtn = stepEl.querySelector('.annotation-edit-btn');
            const addBtn = stepEl.querySelector('.annotation-add-btn');
            const deleteBtn = stepEl.querySelector('.annotation-delete-btn');
            const colorMenu = stepEl.querySelector('.annotation-color-menu');
            const state = {
                wrap,
                img,
                layer: wrap.querySelector('.annotation-layer'),
                editBtn,
                addBtn,
                deleteBtn,
                colorMenu,
                editing: false,
                mode: null,
                selectedColor: null,
                nextMarkerId: 0,
                markers: [],
            };
            initialPoints.forEach(point => {
                const color = (point.color === 'red' || point.color === 'purple')
                    ? point.color : 'green';
                const prefix = point.source === 'filtered'
                    ? (point.state === 'restored' ? 'R' : 'F')
                    : (point.state === 'false_positive' ? 'X' : 'P');
                const colorLabel = color === 'green' ? '绿点' : color === 'purple' ? '紫点' : '红点';
                addAnnotationMarker(state, color, point.x, point.y, 'initial', {
                    label: `${colorLabel} ${prefix}${point.id}`,
                    data: point,
                });
            });

            editBtn.addEventListener('click', () => {
                state.editing = !state.editing;
                wrap.classList.toggle('editing', state.editing);
                editBtn.classList.toggle('active', state.editing);
                panel.classList.toggle('hidden', !state.editing);
                colorMenu.classList.add('hidden');
                if (state.editing) {
                    setAnnotationMode(state, null);
                } else {
                    setAnnotationMode(state, null);
                }
            });

            addBtn.addEventListener('click', () => {
                if (!state.editing) return;
                colorMenu.classList.toggle('hidden');
            });

            colorMenu.querySelectorAll('button[data-color]').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.selectedColor = btn.dataset.color;
                    colorMenu.classList.add('hidden');
                    setAnnotationMode(state, 'add');
                });
            });

            deleteBtn.addEventListener('click', () => {
                if (!state.editing) return;
                colorMenu.classList.add('hidden');
                setAnnotationMode(state, 'delete');
            });

            wrap.addEventListener('click', event => {
                if (!state.editing) {
                    openLightbox(imgUrl);
                    return;
                }
                if (state.mode !== 'add' || !state.selectedColor) return;
                const pos = getPointerRatio(wrap, event);
                addAnnotationMarker(state, state.selectedColor, pos.x, pos.y, 'added');
            });

            wrap.addEventListener('contextmenu', event => {
                if (!state.editing || state.mode !== 'delete') return;
                event.preventDefault();
                const pos = getPointerRatio(wrap, event);
                const marker = findNearestMarker(state, pos.x, pos.y);
                if (marker) removeAnnotationMarker(state, marker);
            });
        }

        function removeProcessingCard() {
            const existing = document.getElementById('processingCard');
            if (existing) existing.remove();
        }

        function showProcessingCard(text = '正在执行下一步分析') {
            removeProcessingCard();
            const container = document.getElementById('pipelineSteps');
            const card = document.createElement('div');
            card.id = 'processingCard';
            card.className = 'processing-card';
            card.innerHTML = `
                <div class="processing-orb"></div>
                <div class="processing-text">${text}<span class="dots"></span></div>
                <span class="processing-badge">处理中</span>
            `;
            container.appendChild(card);
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function appendStep(step, token) {
            if (!isActiveAnalysis(token)) return;
            removeProcessingCard();
            const container = document.getElementById('pipelineSteps');
            const div = document.createElement('div');
            const imgUrl = noCacheUrl(step.url, step.run_id || token);
            const editableFinal = isEditableFinalImage(step.description);
            const editablePoints = Array.isArray(step.editable_points) ? step.editable_points : [];
            const displayImgUrl = noCacheUrl(step.editable_base_url || step.url, step.run_id || token);
            div.className = `pipeline-step${editableFinal ? ' pipeline-step-editable' : ''}`;
            div.style.opacity = '0';
            div.style.transform = 'translateY(12px)';
            div.style.transition = 'opacity 0.3s, transform 0.3s';
            div.innerHTML = `
                <div class="step-number">${step.step}</div>
                <div class="step-content">
                    <div class="step-media">
                        <div class="step-img-wrap${editableFinal ? ' editable-image-wrap' : ''}">
                            <img src="${displayImgUrl}" alt="Step ${step.step}">
                            ${editableFinal ? `
                                <div class="annotation-layer"></div>
                            ` : ''}
                        </div>
                        ${editableFinal ? `
                            <div class="annotation-tools">
                                <button class="annotation-edit-btn" type="button" title="编辑点位">编辑</button>
                                <div class="annotation-tool-panel hidden">
                                    <button class="annotation-tool-btn annotation-add-btn" type="button" title="添加点">+</button>
                                    <div class="annotation-color-menu hidden">
                                        <button type="button" data-color="green"><span class="point-swatch green"></span>绿点</button>
                                        <button type="button" data-color="red"><span class="point-swatch red"></span>红点</button>
                                    </div>
                                    <button class="annotation-tool-btn annotation-delete-btn" type="button" title="删除点">-</button>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="step-desc">
                        ${getTag(step.description)}
                        ${step.description}
                    </div>
                </div>
            `;
            container.appendChild(div);
            if (editableFinal) {
                initEditableFinalImage(div, imgUrl, editablePoints);
            } else {
                const img = div.querySelector('.step-img-wrap img');
                img.addEventListener('click', () => openLightbox(imgUrl));
            }
            requestAnimationFrame(() => {
                div.style.opacity = '1';
                div.style.transform = 'translateY(0)';
            });
            // Show processing card for the next step
            showProcessingCard('正在执行下一步分析');
            div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showResult(data, token) {
            if (!isActiveAnalysis(token)) return;
            removeProcessingCard();
            const grid = document.getElementById('resultGrid');
            const summary = buildResultSummary(data);
            const badge = document.getElementById('sampleIdBadge');
            badge.textContent = summary.sampleId || '';
            grid.innerHTML = `
                ${resultMetric('分支总数', summary.branchCount, '个', { primary: true })}
                ${resultMetric('主花序角果数', summary.mainPods, '个', { primary: true })}
                ${resultMetric('主干+主枝角果数', summary.mainStemPlusMainPods, '个', { primary: true })}
                ${resultMetric('分枝角果数', summary.branchPods, '个', { primary: true })}
                ${resultMetric('总角果数', summary.totalPods, '个', { primary: true })}
                ${resultMetric('主干长度', summary.mainStemLengthCm || summary.mainStemLength, summary.mainStemLengthCm ? 'cm' : '')}
            `;
            const notes = [];
            if (data.plants?.length) {
                data.plants.forEach(p => {
                    let info = `<b>#${p.id} ${p.label}</b>`;
                    if (p.pod_count != null) info += `，角果 ${p.pod_count} 个`;
                    if (p.vlm_verify) {
                        let adjustedByVlm = false;
                        if (p.vlm_verify.false_positives?.length) {
                            const conf = p.vlm_verify.false_positive_confidences || {};
                            const fps = p.vlm_verify.false_positives.map(id => {
                                const c = conf[String(id)] ?? conf[id];
                                return c == null ? `P${id}` : `P${id}(${Number(c).toFixed(2)})`;
                            }).join(', ');
                            info += `，VLM剔除 ${fps}`;
                            adjustedByVlm = true;
                        }
                        if (p.vlm_verify.restored_filtered?.length) {
                            const conf = p.vlm_verify.restored_filtered_confidences || {};
                            const restored = p.vlm_verify.restored_filtered.map(id => {
                                const c = conf[String(id)] ?? conf[id];
                                return c == null ? `F${id}` : `F${id}(${Number(c).toFixed(2)})`;
                            }).join(', ');
                            info += `，VLM补回 ${restored}`;
                            adjustedByVlm = true;
                        }
                        if (!adjustedByVlm) {
                            info += '，VLM复核无调整';
                        }
                    }
                    if (p.description) info += ` — ${p.description}`;
                    notes.push(info);
                });
            }
            document.getElementById('vlmNotes').innerHTML = notes.join('<br>') || '';
            document.querySelector('.results').style.opacity = '0';
            document.querySelector('.results').style.transition = 'opacity 0.4s';
            requestAnimationFrame(() => { document.querySelector('.results').style.opacity = '1'; });
        }

        async function consumeStream(res, token) {
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            while (true) {
                if (!isActiveAnalysis(token)) {
                    await reader.cancel();
                    break;
                }
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const jsonStr = line.slice(6).trim();
                    if (!jsonStr) continue;
                    try {
                        const event = JSON.parse(jsonStr);
                        if (!isActiveAnalysis(token)) return;
                        if (event.type === 'step') appendStep(event, token);
                        else if (event.type === 'result') showResult(event, token);
                        else if (event.type === 'error') {
                            if (!isActiveAnalysis(token)) return;
                            removeProcessingCard();
                            errorBox.textContent = `分析失败: ${event.message}`;
                            errorBox.classList.remove('hidden');
                        }
                    } catch (e) { /* skip malformed */ }
                }
            }
        }

        function resetAnalysisUI() {
            loading.classList.add('hidden');
            errorBox.classList.add('hidden');
            resultSection.classList.remove('hidden');
            document.getElementById('pipelineSteps').innerHTML = '';
            document.getElementById('resultGrid').innerHTML = '';
            document.getElementById('vlmNotes').innerHTML = '';
            document.getElementById('sampleIdBadge').textContent = '';
            showProcessingCard('正在启动分析流水线');
        }

        async function handleFile(file) {
            const { token, controller } = beginAnalysisRun();
            const form = new FormData();
            form.append('file', file);
            try {
                form.append('method', currentMethod);
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    body: form,
                    signal: controller.signal,
                });
                if (!isActiveAnalysis(token)) return;
                if (!res.ok) throw new Error(await res.text());
                loading.classList.add('hidden');
                await consumeStream(res, token);
            } catch (e) {
                if (!isActiveAnalysis(token) || e.name === 'AbortError') return;
                removeProcessingCard();
                errorBox.textContent = `分析失败: ${e.message}`;
                errorBox.classList.remove('hidden');
            } finally {
                if (isActiveAnalysis(token)) loading.classList.add('hidden');
                fileInput.value = '';
            }
        }

        async function analyzeOnline(relPath) {
            const { token, controller } = beginAnalysisRun();
            try {
                const res = await fetch('/api/analyze_online', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: relPath, method: currentMethod }),
                    signal: controller.signal,
                });
                if (!isActiveAnalysis(token)) return;
                if (!res.ok) throw new Error(await res.text());
                loading.classList.add('hidden');
                await consumeStream(res, token);
            } catch (e) {
                if (!isActiveAnalysis(token) || e.name === 'AbortError') return;
                removeProcessingCard();
                errorBox.textContent = `分析失败: ${e.message}`;
                errorBox.classList.remove('hidden');
            } finally {
                if (isActiveAnalysis(token)) loading.classList.add('hidden');
            }
        }

        // ── 在线数据库 Modal ──
        const dbModal = document.getElementById('dbModal');
        const dbList = document.getElementById('dbList');
        const dbPreview = document.getElementById('dbPreview');
        const dbCount = document.getElementById('dbCount');
        const dbTabs = document.getElementById('dbTabs');
        const dbSearch = document.getElementById('dbSearch');
        const dbSelected = document.getElementById('dbSelected');
        const dbSubmitBtn = document.getElementById('dbSubmitBtn');
        const dbDatasets = [
            { id: 'hechuan', label: '合川考种照片', prefix: '农生院卢坤-合川考种照片-整理20260414/' },
            { id: 'spring2026', label: '2026上半年拷种照片', prefix: '2026上半年拷种照片/' },
            { id: 'all', label: '全部图片', prefix: '' },
        ];
        let dbItems = [];
        let dbActiveDataset = 'hechuan';
        let dbSelectedPath = null;

        const currentMethod = 'stalk';
        document.getElementById('openDbStalkBtn').addEventListener('click', openDbModal);
        dbModal.querySelectorAll('[data-close]').forEach(el =>
            el.addEventListener('click', () => dbModal.classList.remove('active'))
        );
        dbSearch.addEventListener('input', () => renderDbList(dbSearch.value.trim().toLowerCase()));
        dbSubmitBtn.addEventListener('click', () => {
            if (!dbSelectedPath) return;
            dbModal.classList.remove('active');
            analyzeOnline(dbSelectedPath);
        });

        async function openDbModal() {
            dbModal.classList.add('active');
            dbList.innerHTML = '<div class="muted" style="text-align:center;padding:40px">加载中...</div>';
            dbCount.textContent = '加载中...';
            dbSelectedPath = null;
            dbSelected.textContent = '未选择';
            dbSubmitBtn.disabled = true;
            dbPreview.innerHTML = '<div class="placeholder">← 从左侧选择一张图片查看预览</div>';
            document.getElementById('dbModalTitle').textContent = '📂 在线数据库 — 🌾 果柄分析';
            dbSubmitBtn.textContent = '提交果柄分析';
            try {
                const res = await fetch('/api/online_images');
                const data = await res.json();
                dbItems = data.items || [];
                renderDbTabs();
                renderDbList('');
            } catch (e) {
                dbList.innerHTML = `<div class="error">加载失败: ${e.message}</div>`;
            }
        }

        function renderDbTabs() {
            dbTabs.innerHTML = dbDatasets.map(ds => {
                const count = ds.prefix
                    ? dbItems.filter(it => it.path.startsWith(ds.prefix)).length
                    : dbItems.length;
                return `
                    <button class="db-tab${ds.id === dbActiveDataset ? ' active' : ''}" data-dataset="${ds.id}">
                        ${ds.label} (${count})
                    </button>
                `;
            }).join('');
            dbTabs.querySelectorAll('.db-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    dbActiveDataset = btn.dataset.dataset;
                    dbSelectedPath = null;
                    dbSelected.textContent = '未选择';
                    dbSubmitBtn.disabled = true;
                    dbPreview.innerHTML = '<div class="placeholder">← 从左侧选择一张图片查看预览</div>';
                    renderDbTabs();
                    renderDbList(dbSearch.value.trim().toLowerCase());
                });
            });
        }

        function getActiveDatasetItems() {
            const dataset = dbDatasets.find(ds => ds.id === dbActiveDataset) || dbDatasets[0];
            if (!dataset.prefix) return dbItems;
            return dbItems.filter(it => it.path.startsWith(dataset.prefix));
        }

        function renderDbList(filter) {
            const datasetItems = getActiveDatasetItems();
            const filtered = filter
                ? datasetItems.filter(it =>
                    it.name.toLowerCase().includes(filter) ||
                    it.folder.toLowerCase().includes(filter))
                : datasetItems;
            const dataset = dbDatasets.find(ds => ds.id === dbActiveDataset) || dbDatasets[0];
            dbCount.textContent = `${dataset.label}：${filtered.length} / ${datasetItems.length} 张`;
            if (!filtered.length) {
                dbList.innerHTML = '<div class="muted" style="text-align:center;padding:40px">无匹配图片</div>';
                return;
            }
            dbList.innerHTML = filtered.map((it, i) => `
                <div class="db-item${it.path === dbSelectedPath ? ' selected' : ''}"
                     data-path="${encodeURIComponent(it.path)}"
                     data-url="${encodeURIComponent(it.url)}"
                     title="${it.folder}/${it.name}">
                    <div class="name">${it.name}</div>
                    <div class="folder">${it.folder}</div>
                </div>
            `).join('');
            dbList.querySelectorAll('.db-item').forEach(el => {
                el.addEventListener('click', () => {
                    const path = decodeURIComponent(el.dataset.path);
                    const url = decodeURIComponent(el.dataset.url);
                    dbSelectedPath = path;
                    dbSubmitBtn.disabled = false;
                    dbSelected.textContent = `已选择：${path}`;
                    dbList.querySelectorAll('.db-item').forEach(e => e.classList.remove('selected'));
                    el.classList.add('selected');
                    // Load preview
                    dbPreview.innerHTML = '<div class="db-preview-loading">加载预览中...</div>';
                    const img = new Image();
                    img.onload = () => {
                        dbPreview.innerHTML = '';
                        dbPreview.appendChild(img);
                    };
                    img.onerror = () => {
                        dbPreview.innerHTML = '<div class="placeholder">预览加载失败</div>';
                    };
                    img.src = url;
                });
            });
        }
    </script>
</body>
