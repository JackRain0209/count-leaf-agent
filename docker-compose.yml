services:
  cv-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: cv-agent:latest
    container_name: cv-agent
    environment:
      HOST: 0.0.0.0
      PORT: 8501
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_API_BASE: ${ARK_API_BASE:-https://ark.cn-beijing.volces.com/api/v3}
      VLM_MODEL: ${VLM_MODEL:-ep-20260420011113-6jvmx}
      VLM_FP_CONFIDENCE_THRESHOLD: ${VLM_FP_CONFIDENCE_THRESHOLD:-0.8}
    ports:
      - "8501:8501"
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./online_uploads:/app/online_uploads
      - ./benchmark_cache:/app/benchmark_cache
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/api/health', timeout=3).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
